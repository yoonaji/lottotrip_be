spring:
  application:
    name: lottotrip
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

oauth:
  kakao:
    # 액세스 토큰으로 사용자 정보를 조회하는 카카오 API.
    # 조회가 성공하면 토큰이 유효한 것이고, 401이면 유효하지 않은 것이다.
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    # 토큰이 어느 앱을 위해 발급됐는지 확인하는 API. app_id가 여기서 나온다.
    token-info-uri: ${KAKAO_TOKEN_INFO_URI:https://kapi.kakao.com/v1/user/access_token_info}
    # 우리 앱의 카카오 앱 ID. 토큰의 app_id가 이 값과 같아야 한다.
    # 비밀값이 아니라 단순 식별자다 - 카카오 developers > 내 애플리케이션 > 앱 설정 > 앱 키에 있다.
    # ⚠️ 비어 있으면 카카오 로그인은 400으로 거절된다. 대조를 건너뛰면 다른 앱에서 발급된
    #    토큰으로도 로그인할 수 있게 되므로, 검사를 못 하면 받지 않는 쪽을 택했다.
    app-id: ${KAKAO_APP_ID:}
  google:
    # identity token의 서명을 검증할 구글 공개키 목록.
    jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    # 우리 앱의 구글 클라이언트 ID. 토큰의 aud가 이 중 하나여야 한다.
    # ⚠️ iOS 클라이언트 ID 미확보 상태다. 비어 있으면 구글 로그인은 400으로 거절된다.
    # 여러 개면 콤마로 잇는다(iOS 앱과 웹이 서로 다른 클라이언트 ID를 쓰는 경우).
    audiences: ${GOOGLE_AUDIENCES:}
  apple:
    # identity token의 서명을 검증할 애플 공개키 목록.
    jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}
    # 우리 앱의 번들 ID(웹이면 Service ID). 토큰의 aud가 이 중 하나여야 한다.
    # ⚠️ 번들 ID 미확보 상태다. 비어 있으면 애플 로그인은 400으로 거절된다.
    # 팀 ID·키 ID·.p8는 필요 없다 — 그것들은 서버가 애플에 토큰을 요청할 때 쓰는 값이다.
    audiences: ${APPLE_AUDIENCES:}

tourapi:
  # 한국관광공사 TourAPI (공공데이터포털). 5단계 장소 데이터 적재에만 쓴다.
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  # 무장애 여행 정보. 인증키·파라미터는 위와 같고 호스트만 다르다.
  # 여기 담긴 장소는 위 서비스의 부분집합이라, 이쪽으로 조회하는 것 자체가 "무장애 등록분만" 필터가 된다.
  with-base-url: ${TOUR_API_WITH_BASE_URL:https://apis.data.go.kr/B551011/KorWithService2}
  # ⚠️ 포털의 "일반 인증키(Decoding)" 값을 넣는다. 인코딩 값을 넣으면 이중 인코딩되어 인증에 실패한다.
  #    비어 있으면 수집 기능만 꺼지고, 서버 기동과 나머지 API에는 영향이 없다.
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ETC
  mobile-app: lottotrip
  # 한 번에 받아올 건수. 크게 잡을수록 호출 횟수가 줄지만 응답이 무거워진다.
  num-of-rows: ${TOUR_API_NUM_OF_ROWS:100}
  # 기동할 때 지역·장소 시드를 돌릴지. 기본은 끔.
  # 적재는 공공 API를 수백~수천 번 부르므로, 켜 두면 서버를 띄울 때마다 할당량이 깎인다.
  # 돌릴 때만 켠다:  SEED_ON_STARTUP=true ./gradlew bootRun
  seed-on-startup: ${SEED_ON_STARTUP:false}
  # 시드 대상 시도 코드. 강원 = 32 (결정 10 — 적재 범위는 강원 한정)
  seed-area-code: ${SEED_AREA_CODE:32}

odsay:
  # ODsay Lab 대중교통(버스+지하철) 경로 조회. 콘솔의 "서비스 플랫폼 환경"에
  # 우리 서버 공인 IP(Elastic IP)가 Server로 등록돼 있어야 호출이 통과한다.
  base-url: ${ODSAY_BASE_URL:https://api.odsay.com/v1/api}
  # 비어 있으면 경로 조회 기능만 꺼지고, 서버 기동과 나머지 API에는 영향이 없다.
  api-key: ${ODSAY_API_KEY:}

naver-map:
  # 네이버 클라우드 플랫폼(NCP) Maps Directions 5 — 자동차 경로 조회.
  # ⚠️ 소셜 로그인용 NAVER_CLIENT_ID/SECRET과는 완전히 다른 키다 — NCP 콘솔의
  # Maps 서비스에서 별도로 발급받는다. 이름이 비슷해서 헷갈리기 쉽다.
  base-url: ${NAVER_MAP_BASE_URL:https://naveropenapi.apigw.ntruss.com/map-direction/v1}
  # 비어 있으면 자동차 경로 조회 기능만 꺼진다.
  api-key-id: ${NAVER_MAP_API_KEY_ID:}
  api-key: ${NAVER_MAP_API_KEY:}

anthropic:
  # Claude API (미션 문구 생성 — 결정 17). 모델은 가장 빠른 것을 쓴다.
  # 이 호출이 슬롯 돌리기 응답 시간에 그대로 얹히기 때문이다.
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  # 응답 길이 상한. 미션 문구 몇 줄이라 크게 잡을 이유가 없다.
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
  # 기다릴 시간(초). 넘기면 템플릿 방식으로 되돌아간다.
  # SDK 기본값은 10분이라, 그대로 두면 슬롯 응답이 10분간 멈춰 있을 수 있다.
  timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:8}

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY:3600}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY:1209600}

app:
  s3:
    bucket: ${AWS_S3_BUCKET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
