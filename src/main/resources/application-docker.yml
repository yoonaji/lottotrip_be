spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:lottotrip}
    username: ${DB_USERNAME:lottotrip}
    password: ${DB_PASSWORD:lottotrip}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:docker-dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:docker-dummy-google-client-secret}
          kakao:
            client-id: ${KAKAO_CLIENT_ID:docker-dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:docker-dummy-kakao-client-secret}
          naver:
            client-id: ${NAVER_CLIENT_ID:docker-dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:docker-dummy-naver-client-secret}

jwt:
  secret: ${JWT_SECRET:docker-dev-only-secret-key-please-change-32bytes}

management:
  endpoints:
    web:
      exposure:
        include: health, info
