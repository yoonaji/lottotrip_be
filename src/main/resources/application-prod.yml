spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

# 프론트가 배포 서버 스펙을 바로 참고할 수 있도록 켜 둔다(2026-08-29 결정).
# 도메인·TLS·인증 없는 IP 접속 서버라 전체 API 구조가 외부에 그대로 노출된다는
# 위험을 알고 켠 것 — 도메인/TLS 붙이거나 팀 외 공개 시점엔 다시 꺼야 한다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
