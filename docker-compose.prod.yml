# EC2에서만 쓴다. docker-compose.yml(로컬용)과 달리 DB 컨테이너를 안 띄우고 RDS를 바라본다.
# 시크릿은 scripts/deploy.sh가 SSM Parameter Store에서 뽑아 .env로 만들어 둔 걸 그대로 읽는다.
# AWS_ACCESS_KEY_ID/SECRET이 없는 건 실수가 아니다 — EC2 인스턴스 role이 자동으로 자격증명을 공급한다.
services:
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      KAKAO_APP_ID: ${KAKAO_APP_ID}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ODSAY_API_KEY: ${ODSAY_API_KEY}
    ports:
      # 80으로 받는다 — 아직 Caddy/TLS를 안 얹어서 보안그룹이 열어둔 포트 중 하나로 바로 붙인다.
      - "80:8080"
    restart: unless-stopped
