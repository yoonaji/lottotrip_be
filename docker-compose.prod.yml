# EC2에서만 쓴다. docker-compose.yml(로컬용)과 달리 DB 컨테이너를 안 띄우고 RDS를 바라본다.
# 시크릿은 scripts/deploy.sh가 SSM Parameter Store에서 뽑아 .env로 만들어 둔 걸 그대로 읽는다.
# AWS_ACCESS_KEY_ID/SECRET이 없는 건 실수가 아니다 — EC2 인스턴스 role이 자동으로 자격증명을 공급한다.
services:
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      KAKAO_APP_ID: ${KAKAO_APP_ID}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ODSAY_API_KEY: ${ODSAY_API_KEY}
      NAVER_MAP_API_KEY_ID: ${NAVER_MAP_API_KEY_ID}
      NAVER_MAP_API_KEY: ${NAVER_MAP_API_KEY}
      TMAP_APP_KEY: ${TMAP_APP_KEY}
    ports:
      # 외부로는 열지 않는다 — 80/443은 caddy가 받아 TLS를 벗기고 여기로 넘긴다.
      # 127.0.0.1에만 묶어 두는 건 deploy.sh 헬스체크가 Caddy 리다이렉트(80→443)에 걸리지 않고
      # 앱에 바로 물어보기 위해서다. 보안그룹은 8080을 열지 않으므로 밖에서는 어차피 안 보인다.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # TLS 종단 + 리버스 프록시. 인증서 발급·갱신·80→443 리다이렉트·WebSocket 통과를 전부 맡는다.
  # 설정은 infra/caddy/Caddyfile 한 장. 웹 프론트가 https에서 wss://로 채팅에 붙으려면 이게 있어야 한다
  # (https 페이지에서 ws://는 mixed content로 브라우저가 막는다).
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      # 인증서를 받을 호스트명. SSM(/lottotrip-dev/APP_DOMAIN) → deploy.sh → .env
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서·ACME 계정. 컨테이너를 갈아엎어도 남아야 한다 — 매번 새로 발급받으면
      # Let's Encrypt 발급 한도(같은 호스트명 주 5회)에 금방 걸린다.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
