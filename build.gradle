plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lottotrip'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. 기본 웹 및 유틸리티
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'  // STOMP 실시간 채팅
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 2. 데이터베이스 (JPA & 로컬/배포용 DB)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'          // 실서비스/도커용
    testRuntimeOnly 'com.h2database:h2'              // 로컬 단위테스트 전용 (운영 클래스패스에서 제외)

    // 3. 운영/AWS 인프라 연동
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // 헬스체크
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:4.0.0'     // S3 연동 (presigner도 이 안에 포함, 별도 s3-presigner 아티팩트 없음)
    implementation 'software.amazon.awssdk:polly:2.41.5'                    // TTS (숏폼 내레이션), s3 버전과 동일하게 고정
    // 필요 시: implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store:4.0.0'

    // 4. 보안 및 인증 (소셜 로그인 + 자체 JWT 발급)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 5. API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 6. 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test' // @DataJpaTest (Boot 4에서 별도 모듈로 분리됨)
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}